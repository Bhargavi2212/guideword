# Every cap and allowance lives here and nowhere else (spec 0.2, PROJECT.md section 7).
# Allowances must sum to GLOBAL_BUDGET_USD (from settings), overall and per environment.

run:
  run_spend_cap_usd: 1.00
  orchestrator_max_steps: 60
  specialist_max_tool_steps: 2
  lopa_top_n: 10
  evidence_top_n: 5
  question_max_attempts: 2
  # demo-fixes plan (approved 2026-10-21): a batch cut off at the token limit, or answered with a
  # duplicate or unsent question, is re-asked one question at a time; hashed, so runs stored
  # without it (D-G) replay unchanged
  retry_failed_batch_singly: true
  connector_max_input_tokens: 80000
  # per routing job; a batch of 10 bulk questions needs room for several findings each (R18)
  max_tokens:
    orchestrator: 4096
    # raised after the case D dev run: answers were cut off at 6144 (you pay only for output)
    specialist_bulk: 12288
    specialist_hard: 12288
    unsure_answer: 6144
    # raised after the case D dev run: Ultra's reasoning used up 4096
    severity_reason: 12288
    section_suggestion: 6144
    test5a: 8192
    # the whole-plant pass (R50, plan C5)
    plant_screen: 12288
    # Phase 3 post-analysis Ultra jobs (plan PR 2): start values as severity_reason, since
    # Ultra's reasoning shares the output budget; re-measure after the first extended run
    connector: 12288
    lopa_argument: 12288
    recommendation: 12288
    chain_severity: 12288
  # questions per specialist call, by tier
  specialist_batch_size:
    # halved after case D dev run 2: Lightning answered questions twice, answered ones not in
    # its batch and was cut off at 12288 with 10 per batch
    lightning: 5
    nano: 10
    super: 5
    ultra: 5
  ai_questions_per_batch: 2
  ai_questions_per_run: 20
  unsure_reanswers_per_run: 10
  # what the orchestrator sees each step (lists are truncated, with counts)
  orchestrator_view: {id_list_max: 20, recent_steps: 5, dispatch_max_question_ids: 60}
  # the analysis stops at the cap minus the severity reserve: ceil(unrated / this) calls,
  # each estimated at severity_output_tokens_estimate output tokens (computed by code, R38)
  severity_batch_size: 10
  # expected output of one severity batch of 10: the 90th percentile measured in case D dev
  # run 2 (median 3145, p90 4688, max 6961); max_tokens.severity_reason stays the ceiling.
  # Re-measure after case G.
  severity_output_tokens_estimate: 4700
  # hypotheses the whole-plant pass may propose (R50); it changes the model's input
  plant_screen_max_hypotheses: 12
  # fewer valid hypotheses than this: one fresh re-ask, then the best attempt is kept (R50 review)
  plant_screen_min_valid: 5
  # input size of one specialist call; steps and jobs are trimmed to fit, else the batch fails (R43)
  specialist_max_input_tokens: 24000
  # Phase 3 (plan PR 2, Q9, Q12): chains the connector may propose (spec 3.1), and lines per
  # LOPA-argument and recommendation call. They change what the model sees, so hashed (R18);
  # an extended run reads them from the current config and records them (spec 3.6)
  connector_max_chains: 10
  lopa_batch_size: 5
  # target-handles plan, Q1: chains per chain-severity call; a call's left-out chains are
  # asked once more, alone (recorded on run_extended, not hashed)
  chain_severity_batch_size: 5
  recommendation_batch_size: 5
  # Q20 (plan PR 5): a new run's post-analysis allowance (P3-2), for run_case.py --post-cap
  # and runs started through the API; hashed like run_spend_cap_usd, so only new runs' IDs
  # move. An extended run gets its own from extend_run.py --post-cap (stored on the Run)
  post_spend_cap_usd: 0.30

plant:
  # the Super section-suggestion call, which runs outside any run
  section_suggest_cap_usd: 0.05

# allowance by use, each enforced in its own environment's ledger
uses:
  development: {environment: laptop, allowance_usd: 5.00}
  test_5: {environment: laptop, allowance_usd: 7.50}
  benchmark: {environment: laptop, allowance_usd: 4.50}
  video: {environment: laptop, allowance_usd: 2.00}
  demo_recording: {environment: hosted, allowance_usd: 1.00}
  judging: {environment: hosted, allowance_usd: 3.00}
  buffer: {environment: hosted, allowance_usd: 2.00}

environments:
  laptop: {allowance_usd: 19.00}
  hosted: {allowance_usd: 6.00}

# live-call caps per phase; a phase with no entry may not make live calls
phase_caps_usd:
  "0": 0.65
  "2": 8.50
  "3": 2.50
  "4": 1.50

# ranking enters Run.caps with the run block (R18). An outside-library cause whose
# failing-component type has no library cause gets this frequency, flagged
# "frequency assumed" (PROJECT.md section 5, Step 6; decision R12).
ranking:
  outside_library_default_frequency_per_year: 0.1
  # P3-4: a piping-leak cause on a line above this size uses IE-PIPE-LEAK-L, at or below it
  # IE-PIPE-LEAK-S; a line with no size_mm uses S, flagged "size assumed"
  pipe_leak_large_above_mm: 150
  # lead tie-break plan (approved 2026-10-21): among supporting findings that tie on rating,
  # severity, frequency and protection, a confirmed line's lead is one from the hypothesis's
  # own section; read per run, so runs stored without it read as before
  lead_prefers_own_section: true

# parallel calls per tier (smoke tests T9 and T13; Super and Nano untested, start at 3)
concurrency: {ultra: 3, super: 3, lightning: 5, nano: 3}

# retries of 429 and 5xx: attempts in total, and the wait before each retry (R13)
gateway:
  max_attempts: 3
  backoff_seconds: [1, 2]
