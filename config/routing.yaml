# Job -> tier (spec 0.2). No job is routed to nano; it stays in models.yaml for the
# four-tier comparison. If a tier leaves the catalog, the next tier in fallback_order is used.
jobs:
  orchestrator: ultra
  connector: ultra
  lopa_argument: ultra
  severity_reason: ultra
  recommendation: ultra
  unsure_answer: ultra
  section_suggestion: super
  specialist_hard: super
  specialist_bulk: lightning
  not_credible: lightning
  extraction: lightning
  test5a: ultra
  # the whole-plant pass, the first step of every run (R50)
  plant_screen: ultra
  # the severity of the connector's chains, in their own batch (Phase 3, plan Q5)
  chain_severity: ultra
  # Phase 4 (spec 4.3 step 4): the precedent judge, one call per evidence line
  precedent_judge: super
# prompt name -> version; a change is a new prompts/<name>/<version>.md plus this entry (R19)
prompts:
  orchestrator: v2
  section_suggestion: v1
  severity: v2
  test5a: v1
  plant_screen: v3
  specialists/process: v2
  specialists/chemistry: v2
  specialists/piping: v2
  specialists/procedures: v2
  specialists/maintenance: v2
  specialists/dust: v2
  # Phase 3 post-analysis steps (plan PR 2); drafted by Claude Code, reviewed by Bhargavi
  connector: v2
  lopa_argument: v3
  recommendation: v2
  severity_chain: v2
  # Phase 4 (plan PR 4); drafted by Claude Code, reviewed by Bhargavi. v2 (2026-10-22): an
  # incident and the same mechanism, each with its reason
  precedent_judge: v2
fallback_order: [nano, lightning, super, ultra]
