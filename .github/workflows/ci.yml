name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (from the repo root, D1)
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-sync backend/requirements.txt backend/requirements-dev.txt
      - name: ruff format
        run: ruff format --check backend scripts
      - name: ruff check
        run: ruff check backend scripts
      - name: mypy (package and scripts, D12)
        run: mypy --config-file backend/pyproject.toml backend/guideword $(ls scripts/*.py 2>/dev/null)
      - name: pytest
        run: pytest backend -q
