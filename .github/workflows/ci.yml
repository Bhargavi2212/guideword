name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the re-attach test compares the rebuilt WG export with an earlier commit's
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (from the repo root, D1)
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-sync backend/requirements.txt backend/requirements-dev.txt
      - name: ruff format
        run: ruff format --check backend scripts
      - name: ruff check
        run: ruff check backend scripts
      - name: mypy (package and scripts, D12)
        run: mypy --config-file backend/pyproject.toml backend/guideword $(ls scripts/*.py 2>/dev/null)
      - name: pytest
        run: pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match contract/openapi.json
        run: npm run gen:types && git diff --exit-code src/api/types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
